name: Publish to npm

# Publishes @loomui-ng/ui (Angular library) and loomui (copy-in CLI) when a GitHub Release is published.
# The release tag must match the version, e.g. tag "v0.1.0" for version 0.1.0.
# Needs the repository secret NPM_TOKEN (an npm automation token with publish rights to the @loomui-ng scope).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and pack, do not publish)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check tag matches package versions
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in libs/ui/package.json packages/loomui-cli/package.json; do
            V=$(node -p "require('./$f').version")
            if [ "$V" != "$TAG" ]; then echo "::error file=$f::version $V does not match tag $GITHUB_REF_NAME"; exit 1; fi
          done

      - name: Build library
        run: npm run build:lib

      - name: Build CLI registry
        run: npm run registry

      - name: Publish @loomui-ng/ui
        working-directory: dist/ui
        run: npm publish --access public --provenance ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish loomui CLI
        working-directory: packages/loomui-cli
        run: npm publish --access public --provenance ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
